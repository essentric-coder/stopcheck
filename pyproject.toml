[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopcheck-pilot"
version = "0.1.2"
description = "A reproducible systems-layer stop evaluation pilot for agent integrations"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.16"]

[project.optional-dependencies]
# Dashboard backend only; the core runner and scorer do not need these.
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
stopcheck = "stopcheck.__main__:main"
stopcheck-web = "stopcheck.web.app:main"

[tool.setuptools.packages.find]
include = ["stopcheck*"]

[tool.setuptools.package-data]
"stopcheck.web" = ["dist/*", "dist/assets/*"]
